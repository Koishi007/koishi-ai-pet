# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: zh-CN

reviews:
  # 评论未解决时提交 Request Changes，全部解决后自动 approve
  request_changes_workflow: true
  auto_review:
    enabled: true
    # base_branches 是追加集合，不替换默认分支；显式列出以避免默认分支判断不一致导致跳过
    base_branches:
      - "master"
      - "dev"
